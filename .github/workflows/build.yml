name: Build BetterPokeBroadcaster

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build and Shadow JAR
        run: ./gradlew build shadowJar --no-daemon

      - name: Upload Compiled JAR
        uses: actions/upload-artifact@v4
        with:
          name: BetterPokeBroadcaster-NeoForge-1.21.1
          path: build/libs/BetterPokeBroadcaster-NeoForge-*.jar
          if-no-files-found: error

      - name: Validate Webhook Payload Structure
        if: github.event_name == 'pull_request'
        env:
          TEST_WEBHOOK_URL: ${{ secrets.TEST_WEBHOOK_URL }}
        run: |
          if [ -n "$TEST_WEBHOOK_URL" ]; then
            curl -H "Content-Type: application/json" \
            -X POST \
            -d '{"username": "GitHub Actions", "embeds": [{"title": "CI/CD Pipeline", "description": "Webhook payload structure successfully validated during build.", "color": 65280}]}' \
            $TEST_WEBHOOK_URL
          else
            echo "TEST_WEBHOOK_URL secret not found. Skipping payload validation step."
          fi